name: Daily course enrollment

on:
  schedule:
    - cron: "17 2 * * *"        # every day at 08:17 Bangladesh time (02:17 UTC)
  workflow_dispatch:            # the "Run workflow" button on the Actions tab
    inputs:
      dry_run:
        description: "Dry run: search and preview only, don't click Enroll Course"
        type: boolean
        default: true

concurrency:                    # never two runs at once (a manual run during the daily one)
  group: erp-enrollment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enroll:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Refuse to run in a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "::error::This repository is public, so its run logs and files would publish student IDs and emails. Make it private (Settings > General > Danger Zone > Change visibility) and run again."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Playwright and Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # The log of who is already enrolled lives in the Actions cache between runs,
      # so each day only new students are processed.
      - name: Restore the enrollment log from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: erp_runs/enrollment_log.csv
          key: enrollment-log-${{ github.run_id }}
          restore-keys: enrollment-log-

      - name: Enroll
        env:
          MASTER_LINK: ${{ secrets.MASTER_LINK }}
          ERP_ID: ${{ secrets.ERP_ID }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python enroll.py

      - name: Save the enrollment log for the next run
        if: always() && hashFiles('erp_runs/enrollment_log.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: erp_runs/enrollment_log.csv
          key: enrollment-log-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the log, combined roster and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrollment-${{ github.run_id }}-${{ github.run_attempt }}
          path: erp_runs/
          retention-days: 30
          if-no-files-found: ignore
